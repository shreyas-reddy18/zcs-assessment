# Continuous deployment, run by the GitHub push trigger on main.
#   tests -> build both images (parallel) -> deploy MCP server, gateway and agent.
# Environment-specific values come from the trigger's substitutions, not this file.
# Cloud Run services keep their existing service account, env vars and IAM; only the image changes.
substitutions:
  _REGION: us-central1
  _AR_REPO: cloud-run-source-deploy
  _MCP_SERVICE: meridian-mcp
  _GATEWAY_SERVICE: meridian-gateway
  # Required for the agent step (set on the trigger):
  _AGENT_ENGINE_RESOURCE: ""
  _AGENT_STAGING_BUCKET: ""
  _AGENT_SERVICE_ACCOUNT: ""
  _VERTEX_DATA_STORE_ID: ""
  _MCP_URL: ""
  _AS_OF_DATE: ""
  _AGENT_MODEL: gemini-2.5-flash

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q pytest && python -m pytest -q tests"]

  - id: build-mcp
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-f", "mcp_server/Dockerfile",
           "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/meridian-mcp:${SHORT_SHA}", "."]

  - id: build-gateway
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-f", "gateway/Dockerfile",
           "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/meridian-gateway:${SHORT_SHA}", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: ["test", "build-mcp", "build-gateway"]
    entrypoint: bash
    args: ["-c", "docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/meridian-mcp:${SHORT_SHA} && docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/meridian-gateway:${SHORT_SHA}"]

  - id: deploy-mcp
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["push"]
    entrypoint: gcloud
    args: ["run", "services", "update", "${_MCP_SERVICE}", "--region", "${_REGION}",
           "--image", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/meridian-mcp:${SHORT_SHA}",
           "--update-env-vars", "AS_OF_DATE=${_AS_OF_DATE}", "--quiet"]

  - id: deploy-agent
    name: python:3.12-slim
    waitFor: ["deploy-mcp"]
    entrypoint: bash
    args: ["-c", "pip install -q -r agent/requirements.txt && python -m scripts.deploy_agent"]
    env:
      - GCP_PROJECT_ID=${PROJECT_ID}
      - GCP_REGION=${_REGION}
      - AGENT_MODEL=${_AGENT_MODEL}
      - AGENT_ENGINE_RESOURCE=${_AGENT_ENGINE_RESOURCE}
      - AGENT_STAGING_BUCKET=${_AGENT_STAGING_BUCKET}
      - AGENT_SERVICE_ACCOUNT=${_AGENT_SERVICE_ACCOUNT}
      - VERTEX_SEARCH_LOCATION=global
      - VERTEX_DATA_STORE_ID=${_VERTEX_DATA_STORE_ID}
      - MCP_URL=${_MCP_URL}
      - AS_OF_DATE=${_AS_OF_DATE}

  - id: deploy-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["push"]
    entrypoint: gcloud
    args: ["run", "services", "update", "${_GATEWAY_SERVICE}", "--region", "${_REGION}",
           "--image", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/meridian-gateway:${SHORT_SHA}", "--quiet"]

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/meridian-mcp:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/meridian-gateway:${SHORT_SHA}
